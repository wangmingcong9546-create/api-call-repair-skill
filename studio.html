<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo-Retro Pop 讲解剪辑台</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #141414; color: #f7f5f0; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { display: flex; height: 100%; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #stageWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #0e0e0e; }
  #cv { background: #0077c8; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid #2a2a2a; flex-wrap: wrap; }
  button, select, input[type="file"] { font: inherit; font-size: 13px; background: #242424; color: #f7f5f0; border: 1px solid #3a3a3a; border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button.primary { background: #f7d117; color: #141414; border-color: #141414; font-weight: 700; }
  button.on { background: #f7f5f0; color: #141414; }
  #scrub { flex: 1; min-width: 140px; accent-color: #f7d117; }
  #time { font-variant-numeric: tabular-nums; font-size: 13px; opacity: .85; }
  #side { width: 320px; display: flex; flex-direction: column; border-left: 1px solid #2a2a2a; background: #1a1a1a; }
  #saybox { padding: 14px 14px 8px; border-bottom: 1px solid #2a2a2a; }
  #sayk { font-size: 12px; letter-spacing: .08em; opacity: .6; }
  #say { font-size: 18px; font-weight: 700; line-height: 1.45; margin: 6px 0; min-height: 3.2em; }
  #saynext { font-size: 13px; opacity: .7; line-height: 1.4; }
  #scenes { overflow: auto; flex: 1; }
  .sc { display: block; width: 100%; text-align: left; background: transparent; color: inherit; border: 0; border-bottom: 1px solid #262626; padding: 8px 12px; cursor: pointer; }
  .sc.on { background: #2a2412; }
  .sc b { display: block; font-size: 13px; }
  .sc span { font-size: 12px; opacity: .65; }
  #warn { font-size: 12px; color: #e5b822; padding: 8px 12px; white-space: pre-wrap; }
  details { border-top: 1px solid #2a2a2a; padding: 8px 12px 12px; }
  textarea { width: 100%; height: 180px; box-sizing: border-box; background: #111; color: #f7f5f0; border: 1px solid #333; border-radius: 8px; font: 12px/1.4 ui-monospace, monospace; }
  #mask { position: fixed; inset: 0; background: rgba(10,10,10,.72); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-size: 22px; font-weight: 700; }
  #mask[hidden] { display: none; }
  body.bare #side, body.bare #bar, body.bare #mask { display: none !important; }
  body.bare, body.bare #app, body.bare #main, body.bare #stageWrap { height: 100%; width: 100%; overflow: hidden; }
  body.bare #cv { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="stageWrap"><canvas id="cv" width="1280" height="720"></canvas></div>
    <div id="bar">
      <button id="play" class="primary">播放</button>
      <input id="scrub" type="range" min="0" max="1000" value="0">
      <span id="time">00:00 / 00:00</span>
      <button data-aspect="16:9">16:9</button>
      <button data-aspect="9:16">9:16</button>
      <button data-aspect="3:4">3:4</button>
      <select id="presenter">
        <option value="none">无人出镜</option>
        <option value="right">右侧留给真人</option>
        <option value="left">左侧留给真人</option>
      </select>
      <button id="subs">字幕</button>
      <button id="guides">安全区</button>
      <button id="mute">音效</button>
      <button id="exp">导出全片</button>
      <button id="expChap">导出本章</button>
    </div>
  </div>
  <aside id="side">
    <div id="saybox">
      <div id="sayk">当前口播</div>
      <div id="say">…</div>
      <div id="saynext"></div>
    </div>
    <div id="scenes"></div>
    <div id="warn"></div>
    <details>
      <summary>脚本 JSON</summary>
      <p style="font-size:12px;opacity:.7">把任意 AI 按技能规范写出的 JSON 粘到下面，点「应用脚本」。截图放到「载入图片」，文件名要和场景里的 src 一致。</p>
      <textarea id="editor" spellcheck="false"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button id="apply" class="primary">应用脚本</button>
        <button id="copy">复制口播稿</button>
        <button id="demo">恢复示例</button>
        <label>载入图片<input id="imgs" type="file" accept="image/*" multiple hidden></label>
      </div>
    </details>
  </aside>
</div>
<div id="mask" hidden><div id="pct">正在导出 0%</div><button id="cancel">取消</button></div>
<script src="src/01_core.js"></script>
<script src="src/02_props.js"></script>
<script src="src/02b_extras.js"></script>
<script src="src/03_scene.js"></script>
<script src="src/04a_templates.js"></script>
<script src="src/04b_templates.js"></script>
<script src="demo_story.js"></script>
<script src="src/05_app.js"></script>
</body>
</html>
